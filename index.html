<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kiwi Renovator</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101214;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:#f4f4f4;
}

#panel{
  position:absolute;
  left:18px;
  top:28px;
  width:min(430px,52vw);
  padding:22px;
  border-radius:22px;
  background:rgba(9,14,17,.88);
  border:1px solid rgba(255,255,255,.13);
}

#title{
  font-size:30px;
  font-weight:800;
  color:#ffad38;
  margin-bottom:18px;
}

.task{
  font-size:16px;
  margin:15px 0;
}

.done{
  text-decoration:line-through;
  color:#82cf91;
}

#money{
  position:absolute;
  right:18px;
  top:28px;
  padding:18px 23px;
  border-radius:20px;
  background:rgba(9,14,17,.9);
  border:1px solid rgba(255,255,255,.13);
  font-size:26px;
  font-weight:800;
}

#cross{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:42px;
  text-shadow:0 1px 4px #000;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:18px;
  height:190px;
  pointer-events:auto;
}

#joy{
  position:absolute;
  left:28px;
  bottom:8px;
  width:130px;
  height:130px;
  border:3px solid #aaa;
  border-radius:50%;
  background:#1116;
}

#knob{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#ddd;
  transform:translate(-50%,-50%);
}

#tools{
  position:absolute;
  left:50%;
  bottom:5px;
  transform:translateX(-50%);
  display:flex;
  gap:9px;
}

.tool{
  width:95px;
  min-height:62px;
  border-radius:14px;
  border:1px solid #394149;
  background:#101519;
  color:#eee;
  font-size:14px;
}

.tool.active{
  border:3px solid #f39a27;
  background:#392817;
}

#use{
  position:absolute;
  right:28px;
  bottom:2px;
  width:140px;
  height:140px;
  border-radius:50%;
  border:5px solid #ffe0b2;
  background:#e78918;
  color:#fff;
  font-size:28px;
  font-weight:800;
}

#hint{
  position:absolute;
  right:38px;
  bottom:150px;
  font-size:15px;
  text-align:center;
}

#start{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}

#card{
  width:min(560px,84vw);
  padding:36px;
  border-radius:28px;
  background:#10171bdd;
  border:1px solid #465057;
  color:#ddd;
}

#card h1{
  margin:0;
  color:#ffae3d;
  font-size:42px;
}

#card p{
  font-size:19px;
  line-height:1.55;
}

#startBtn{
  width:100%;
  padding:20px;
  border:0;
  border-radius:15px;
  background:#e98b1c;
  color:white;
  font-size:24px;
  font-weight:bold;
}

@media(max-width:650px){

  #panel{
    width:46vw;
    padding:15px;
    top:16px;
    left:12px;
  }

  .task{
    font-size:13px;
    margin:11px 0;
  }

  #title{
    font-size:23px;
  }

  #money{
    top:16px;
    right:12px;
    font-size:20px;
    padding:14px;
  }

  .tool{
    width:78px;
  }

  #use{
    width:122px;
    height:122px;
    right:16px;
  }
}
</style>
</head>

<body>

<div id="start">
  <div id="card">

    <h1>KIWI RENOVATOR</h1>

    <h3>JOB #001 — DAMAGED BEDROOM</h3>

    <p><b>Property:</b> Wellington, New Zealand</p>

    <p>
      Walk around the bedroom and repair the
      water-damaged wall.
    </p>

    <button id="startBtn">START JOB</button>

  </div>
</div>

<canvas id="game"></canvas>

<div id="hud">

  <div id="panel">

    <div id="title">JOB #001</div>

    <div class="task" id="t1">
      ☐ Inspect damaged wall
    </div>

    <div class="task" id="t2">
      ☐ Remove damaged GIB
    </div>

    <div class="task" id="t3">
      ☐ Inspect timber framing
    </div>

    <div class="task" id="t4">
      ☐ Install new wall lining
    </div>

  </div>

  <div id="money">
    💰 $<span id="cash">0</span>
  </div>

  <div id="cross">+</div>

  <div id="controls">

    <div id="joy">
      <div id="knob"></div>
    </div>

    <div id="tools">

      <button class="tool active" data-tool="inspect">
        🔎<br>Inspect
      </button>

      <button class="tool" data-tool="hammer">
        🔨<br>Hammer
      </button>

      <button class="tool" data-tool="nailgun">
        🔫<br>Nail Gun
      </button>

    </div>

    <div id="hint">
      Walk to the damaged wall
    </div>

    <button id="use">
      USE<br>🔨
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let yaw = 0;
let pitch = 0;

let moveX = 0;
let moveY = 0;

let started = false;
let looking = false;

let lastX = 0;
let lastY = 0;

let selectedTool = "inspect";
let stage = 0;

let player;

let damagedWall;

function createMaterial(color){

  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:0.8
  });

}

function addBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const mesh = new THREE.Mesh(

    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),

    material

  );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow = true;

  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;

}

function init(){

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x9ab0bd);

  scene.fog =
    new THREE.Fog(
      0x9ab0bd,
      8,
      18
    );


  camera =
    new THREE.PerspectiveCamera(

      70,

      window.innerWidth /
      window.innerHeight,

      0.1,

      100

    );


  player =
    new THREE.Vector3(
      0,
      1.65,
      4.5
    );


  camera.position.copy(
    player
  );


  renderer =
    new THREE.WebGLRenderer({

      canvas:
        document.getElementById("game"),

      antialias:true

    });


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );


  renderer.shadowMap.enabled =
    true;


  renderer.outputEncoding =
    THREE.sRGBEncoding;



  createRoom();

  setupControls();

  animate();

}

function createRoom(){

  const wall =
    createMaterial(
      0xd7d1c7
    );


  const floor =
    createMaterial(
      0xa98b6c
    );


  const ceiling =
    createMaterial(
      0xf1eee8
    );


  /* FLOOR */

  addBox(

    8,

    0.1,

    8,

    0,

    0,

    0,

    floor

  );


  /* BACK WALL */

  addBox(

    8,

    3,

    0.12,

    0,

    1.5,

    -3.8,

    wall

  );


  /* LEFT WALL */

  addBox(

    0.12,

    3,

    8,

    -4,

    1.5,

    0,

    wall

  );


  /* RIGHT WALL */

  addBox(

    0.12,

    3,

    8,

    4,

    1.5,

    0,

    wall

  );


  /* CEILING */

  addBox(

    8,

    0.1,

    8,

    0,

    3,

    0,

    ceiling

  );


  /* BED */

  const bedBase =
    createMaterial(
      0x3d2b20
    );


  const mattress =
    createMaterial(
      0xe5dfd5
    );


  addBox(

    2.4,

    0.45,

    1.7,

    1.7,

    0.45,

    -1.5,

    bedBase

  );


  addBox(

    2.3,

    0.3,

    1.6,

    1.7,

    0.82,

    -1.5,

    mattress

  );


  /* WINDOW */

  const glass =
    new THREE.MeshStandardMaterial({

      color:
        0x8db7cf,

      transparent:
        true,

      opacity:
        0.7

    });


  const windowMesh =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        1.5,
        1.1
      ),

      glass

    );


  windowMesh.position.set(
    -2.3,
    1.7,
    -3.72
  );


  scene.add(
    windowMesh
  );


  /* DAMAGED WALL */

  damagedWall =
    new THREE.Group();


  damagedWall.position.set(
    0.4,
    1.45,
    -3.72
  );


  scene.add(
    damagedWall
  );


  const damageMaterial =
    createMaterial(
      0x725b48
    );


  const damage =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        1.5,
        1.3
      ),

      damageMaterial

    );


  damage.position.z =
    0.01;


  damagedWall.add(
    damage
  );


  /* WATER STAINS */

  for(
    let i = 0;
    i < 10;
    i++
  ){

    const stain =
      new THREE.Mesh(

        new THREE.CircleGeometry(

          0.1 +
          Math.random() * 0.2,

          24

        ),

        new THREE.MeshBasicMaterial({

          color:
            0x3e3025,

          transparent:
            true,

          opacity:
            0.45

        })

      );


    stain.position.set(

      (
        Math.random() - 0.5
      ) * 1.2,

      (
        Math.random() - 0.5
      ) * 1,

      0.02

    );


    damagedWall.add(
      stain
    );

  }


  /* LIGHTING */

  const hemi =
    new THREE.HemisphereLight(

      0xe4f2ff,

      0x715b46,

      1.5

    );


  scene.add(
    hemi
  );


  const sunlight =
    new THREE.DirectionalLight(

      0xffe2b8,

      2

    );


  sunlight.position.set(
    -3,
    5,
    2
  );


  sunlight.castShadow =
    true;


  scene.add(
    sunlight
  );


  const roomLight =
    new THREE.PointLight(

      0xffc47d,

      2,

      8

    );


  roomLight.position.set(
    0,
    2.6,
    0
  );


  scene.add(
    roomLight
  );

}

function finishTask(id){

  const element =
    document.getElementById(id);


  element.classList.add(
    "done"
  );


  element.textContent =
    "☑ " +
    element.textContent.substring(2);

}

function showHint(text){

  document.getElementById(
    "hint"
  ).textContent =
    text;

}

function interact(){

  if(!started){
    return;
  }


  const damagePosition =
    new THREE.Vector3(
      0.4,
      1.4,
      -3.5
    );


  const distance =
    player.distanceTo(
      damagePosition
    );


  if(distance > 2.8){

    showHint(
      "Move closer to the damaged wall"
    );

    return;

  }


  if(
    stage === 0 &&
    selectedTool === "inspect"
  ){

    stage = 1;

    finishTask("t1");

    showHint(
      "Damage found. Select Hammer."
    );

  }


  else if(
    stage === 1 &&
    selectedTool === "hammer"
  ){

    stage = 2;

    finishTask("t2");

    showHint(
      "GIB removed. Inspect framing."
    );

  }


  else if(
    stage === 2 &&
    selectedTool === "inspect"
  ){

    stage = 3;

    finishTask("t3");

    showHint(
      "Framing is good. Use Nail Gun."
    );

  }


  else if(
    stage === 3 &&
    selectedTool === "nailgun"
  ){

    stage = 4;

    finishTask("t4");

    damagedWall.visible =
      false;


    document.getElementById(
      "cash"
    ).textContent =
      "850";


    showHint(
      "JOB COMPLETE! +$850"
    );

  }


  else{

    showHint(
      "Select the correct tool"
    );

  }

}

function setupControls(){

  document.getElementById(
    "startBtn"
  ).onclick =
    function(){

      started = true;


      document.getElementById(
        "start"
      ).style.display =
        "none";


      showHint(
        "Walk to the damaged wall and inspect it"
      );

    };


  document.getElementById(
    "use"
  ).onclick =
    interact;


  document
    .querySelectorAll(".tool")
    .forEach(

      function(button){

        button.onclick =
          function(){

            document
              .querySelectorAll(".tool")
              .forEach(

                function(b){

                  b.classList.remove(
                    "active"
                  );

                }

              );


            button.classList.add(
              "active"
            );


            selectedTool =
              button.dataset.tool;

          };

      }

    );


  const joy =
    document.getElementById(
      "joy"
    );


  const knob =
    document.getElementById(
      "knob"
    );


  let joyActive =
    false;


  function updateJoystick(event){

    const rect =
      joy.getBoundingClientRect();


    let x =
      event.clientX -
      (
        rect.left +
        rect.width / 2
      );


    let y =
      event.clientY -
      (
        rect.top +
        rect.height / 2
      );


    const max =
      36;


    const length =
      Math.sqrt(
        x*x +
        y*y
      );


    if(length > max){

      x =
        x / length * max;

      y =
        y / length * max;

    }


    knob.style.transform =
      "translate(calc(-50% + " +
      x +
      "px), calc(-50% + " +
      y +
      "px))";


    moveX =
      x / max;


    moveY =
      -y / max;

  }


  joy.addEventListener(

    "pointerdown",

    function(event){

      joyActive = true;

      joy.setPointerCapture(
        event.pointerId
      );

      updateJoystick(
        event
      );

    }

  );


  joy.addEventListener(

    "pointermove",

    function(event){

      if(joyActive){

        updateJoystick(
          event
        );

      }

    }

  );


  joy.addEventListener(

    "pointerup",

    function(){

      joyActive =
        false;


      moveX =
        0;


      moveY =
        0;


      knob.style.transform =
        "translate(-50%,-50%)";

    }

  );


  const canvas =
    document.getElementById(
      "game"
    );


  canvas.addEventListener(

    "pointerdown",

    function(event){

      looking = true;

      lastX =
        event.clientX;

      lastY =
        event.clientY;

    }

  );


  canvas.addEventListener(

    "pointermove",

    function(event){

      if(!looking){
        return;
      }


      const dx =
        event.clientX -
        lastX;


      const dy =
        event.clientY -
        lastY;


      lastX =
        event.clientX;


      lastY =
        event.clientY;


      yaw -=
        dx * 0.006;


      pitch -=
        dy * 0.004;


      pitch =
        Math.max(

          -1.1,

          Math.min(
            1.1,
            pitch
          )

        );

    }

  );


  canvas.addEventListener(

    "pointerup",

    function(){

      looking =
        false;

    }

  );


  window.addEventListener(

    "resize",

    function(){

      camera.aspect =
        window.innerWidth /
        window.innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(

        window.innerWidth,

        window.innerHeight

      );

    }

  );

}

function updatePlayer(){

  const speed =
    0.055;


  const forwardX =
    Math.sin(yaw);


  const forwardZ =
    Math.cos(yaw);


  player.x +=

    (
      -forwardX *
      moveY +

      forwardZ *
      moveX

    ) *
    speed;


  player.z +=

    (
      -forwardZ *
      moveY -

      forwardX *
      moveX

    ) *
    speed;


  player.x =
    Math.max(

      -3.5,

      Math.min(
        3.5,
        player.x
      )

    );


  player.z =
    Math.max(

      -3.3,

      Math.min(
        3.3,
        player.z
      )

    );


  camera.position.copy(
    player
  );


  const target =
    new THREE.Vector3(

      player.x -
      Math.sin(yaw),

      player.y +
      Math.sin(pitch),

      player.z -
      Math.cos(yaw)

    );


  camera.lookAt(
    target
  );

}

function animate(){

  requestAnimationFrame(
    animate
  );


  if(started){

    updatePlayer();

  }


  renderer.render(
    scene,
    camera
  );

}

init();

</script>

</body>
</html>
