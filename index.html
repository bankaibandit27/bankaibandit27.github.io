<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Kiwi Renovator</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  color: #fff;
}

canvas {
  position: fixed;
  inset: 0;
}

#ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.panel {
  background: #0b1216e8;
  border: 1px solid #344047;
  border-radius: 24px;
}

#job {
  position: absolute;
  top: 18px;
  left: 18px;
  padding: 20px;
  width: min(470px, 62vw);
}

h1 {
  margin: 0 0 14px;
  color: #ffad3d;
  font-size: 34px;
}

.task {
  margin: 15px 0;
  font-size: 19px;
}

.done {
  color: #88d89d;
  text-decoration: line-through;
}

#cash {
  position: absolute;
  right: 18px;
  top: 18px;
  padding: 22px;
  font-size: 30px;
  font-weight: bold;
}

.cross {
  position: absolute;
  left: 50%;
  top: 50%;
  font-size: 42px;
  transform: translate(-50%, -50%);
}

#joy {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 130px;
  height: 130px;
  border: 3px solid #aaa;
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 62px;
  height: 62px;
  left: 31px;
  top: 31px;
  background: #ddd;
  border-radius: 50%;
}

#tools {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.tool {
  width: 100px;
  height: 70px;
  background: #10181b;
  color: #eee;
  border: 2px solid #344047;
  border-radius: 15px;
  font-size: 15px;
}

.active {
  border-color: #f3a333;
}

#use {
  position: absolute;
  right: 24px;
  bottom: 24px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 4px solid #ffe0b0;
  background: #e98a10;
  color: #fff;
  font-size: 27px;
  font-weight: bold;
  pointer-events: auto;
}

#msg {
  position: absolute;
  left: 50%;
  top: 60%;
  transform: translateX(-50%);
  font-size: 18px;
  text-align: center;
  text-shadow: 0 2px 4px #000;
}

#start {
  position: absolute;
  inset: 0;
  background: #05090ccc;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

#card {
  width: min(620px, 84vw);
  padding: 36px;
  background: #10191dee;
  border: 1px solid #3a474c;
  border-radius: 28px;
}

#card h2 {
  color: #ffad3d;
  font-size: 42px;
  margin: 0 0 8px;
}

#card p {
  font-size: 18px;
  line-height: 1.5;
}

#startBtn {
  width: 100%;
  padding: 20px;
  background: #e98a10;
  border: 0;
  border-radius: 14px;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
}

@media(max-width:600px) {

  #job {
    width: calc(100vw - 55px);
    padding: 16px;
  }

  .task {
    font-size: 16px;
  }

  #tools {
    bottom: 18px;
  }

  .tool {
    width: 88px;
    height: 65px;
    font-size: 13px;
  }

  #joy {
    width: 110px;
    height: 110px;
    bottom: 20px;
    left: 20px;
  }

  #stick {
    width: 54px;
    height: 54px;
    left: 25px;
    top: 25px;
  }

  #use {
    width: 122px;
    height: 122px;
    bottom: 18px;
    right: 18px;
  }

}

</style>
</head>

<body>

<div id="ui">

  <div id="job" class="panel">

    <h1>JOB #001</h1>

    <div id="t1" class="task">
      □ Inspect damaged wall
    </div>

    <div id="t2" class="task">
      □ Remove damaged GIB
    </div>

    <div id="t3" class="task">
      □ Inspect timber framing
    </div>

    <div id="t4" class="task">
      □ Install new wall lining
    </div>

  </div>


  <div id="cash" class="panel">
    💰 $<span>0</span>
  </div>


  <div class="cross">+</div>


  <div id="msg"></div>


  <div id="joy">
    <div id="stick"></div>
  </div>


  <div id="tools">

    <button class="tool active" data="inspect">
      🔎<br>
      Inspect
    </button>

    <button class="tool" data="hammer">
      🔨<br>
      Hammer
    </button>

    <button class="tool" data="nail">
      🔫<br>
      Nail Gun
    </button>

  </div>


  <button id="use">
    USE<br>
    🔨
  </button>


  <div id="start">

    <div id="card">

      <h2>KIWI RENOVATOR</h2>

      <p>
        <b>JOB #001 — DAMAGED BEDROOM</b>
      </p>

      <p>
        <b>Property:</b>
        Wellington, New Zealand
      </p>

      <p>
        Inspect the water damage, remove damaged GIB,
        check the timber framing and install new wall lining.
      </p>

      <button id="startBtn">
        START JOB
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>


<script>

let scene;
let camera;
let renderer;
let clock;

let yaw = 0;
let pitch = 0;

let forward = 0;
let side = 0;

let started = false;
let tool = "inspect";

let damage;
let ray;

let inspected = false;
let removed = false;
let framed = false;
let installed = false;


const $ = x => document.getElementById(x);


function M(color) {

  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.85
  });

}


function box(w, h, d, x, y, z, material) {

  let mesh = new THREE.Mesh(

    new THREE.BoxGeometry(w, h, d),

    material

  );

  mesh.position.set(x, y, z);

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;

}


function init() {

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x92a1a6);

  scene.fog =
    new THREE.Fog(0x92a1a6, 12, 30);


  camera =
    new THREE.PerspectiveCamera(

      72,

      innerWidth / innerHeight,

      0.05,

      100

    );


  camera.position.set(
    0,
    1.65,
    5.5
  );


  camera.rotation.order = "YXZ";


  renderer =
    new THREE.WebGLRenderer({
      antialias: true
    });


  renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.shadowMap.enabled = true;

  renderer.outputEncoding =
    THREE.sRGBEncoding;


  document.body.appendChild(
    renderer.domElement
  );


  clock = new THREE.Clock();

  ray = new THREE.Raycaster();


  room();

  input();

  animate();

}


function room() {


  let wall =
    M(0xd8d0c5);


  let floor =
    M(0xa68b6f);


  let white =
    M(0xe9e5dd);


  let dark =
    M(0x2a211d);



  /* FLOOR */

  box(
    9,
    0.12,
    9,
    0,
    0,
    0,
    floor
  );


  /* BACK WALL */

  box(
    9,
    3.1,
    0.15,
    0,
    1.55,
    -2.7,
    wall
  );


  /* LEFT WALL */

  box(
    0.15,
    3.1,
    9,
    -4.4,
    1.55,
    1.5,
    wall
  );


  /* RIGHT WALL */

  box(
    0.15,
    3.1,
    9,
    4.4,
    1.55,
    1.5,
    wall
  );


  /* CEILING */

  box(
    9,
    0.1,
    9,
    0,
    3.1,
    0,
    white
  );



  /* BED BASE */

  box(
    2.8,
    0.45,
    2.1,
    1.5,
    0.45,
    0.8,
    dark
  );


  /* MATTRESS */

  box(
    2.65,
    0.35,
    1.95,
    1.5,
    0.82,
    0.8,
    white
  );


  /* HEADBOARD */

  box(
    2.65,
    0.48,
    0.15,
    1.5,
    1.22,
    1.72,
    white
  );



  /* DAMAGED WALL PANEL */

  box(
    2.25,
    1.5,
    0.05,
    -1,
    1.65,
    -2.59,
    M(0x735f4e)
  );


  damage =
    scene.children[
      scene.children.length - 1
    ];


  damage.name =
    "damage";



  /* WATER DAMAGE MARKS */

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    let spot =
      new THREE.Mesh(

        new THREE.CircleGeometry(
          0.2 + Math.random() * 0.18,
          24
        ),

        new THREE.MeshBasicMaterial({

          color: 0x453b34,

          transparent: true,

          opacity: 0.65

        })

      );


    spot.position.set(

      -1.8 +
      Math.random() * 1.5,

      1 +
      Math.random() * 1.3,

      -2.54

    );


    scene.add(spot);

  }



  /* LIGHTING */

  let hemi =
    new THREE.HemisphereLight(

      0xe8f4ff,

      0x695646,

      1.7

    );


  scene.add(hemi);



  let sun =
    new THREE.DirectionalLight(

      0xffefce,

      2.2

    );


  sun.position.set(
    -3,
    5,
    3
  );


  sun.castShadow = true;


  scene.add(sun);



  let lamp =
    new THREE.PointLight(

      0xffd58a,

      1.2,

      6

    );


  lamp.position.set(
    0,
    2.5,
    1
  );


  scene.add(lamp);

}



function say(text) {

  $("msg").textContent =
    text;


  clearTimeout(
    window.mt
  );


  window.mt =
    setTimeout(

      () => {

        $("msg").textContent =
          "";

      },

      2500

    );

}



function finish(id) {

  $(id).classList.add(
    "done"
  );


  $(id).textContent =
    "☑ " +
    $(id).textContent.slice(2);

}



function framing() {


  for (
    let x = -2;
    x <= 0;
    x += 0.5
  ) {

    box(

      0.1,

      1.55,

      0.14,

      x,

      1.65,

      -2.5,

      M(0x9a7048)

    );

  }

}



function interact() {


  if (!started) {

    return;

  }


  ray.setFromCamera(

    {
      x: 0,
      y: 0
    },

    camera

  );


  let hit =
    ray.intersectObject(
      damage
    );


  if (!hit.length) {

    say(
      "Aim at the damaged wall and move closer."
    );

    return;

  }



  /* INSPECT DAMAGE */

  if (

    tool === "inspect" &&

    !inspected

  ) {

    inspected = true;

    finish("t1");

    say(
      "Water damage confirmed. Switch to Hammer."
    );

  }



  /* REMOVE GIB */

  else if (

    tool === "hammer" &&

    inspected &&

    !removed

  ) {

    removed = true;

    finish("t2");

    damage.visible =
      false;


    framing();


    say(
      "GIB removed. Inspect the timber framing."
    );

  }



  /* INSPECT FRAMING */

  else if (

    tool === "inspect" &&

    removed &&

    !framed

  ) {

    framed = true;

    finish("t3");

    say(
      "Framing is sound. Switch to Nail Gun."
    );

  }



  /* INSTALL NEW LINING */

  else if (

    tool === "nail" &&

    framed &&

    !installed

  ) {

    installed = true;

    finish("t4");


    box(

      2.3,

      1.55,

      0.06,

      -1,

      1.65,

      -2.58,

      M(0xd8d0c5)

    );


    $("cash")
      .querySelector("span")
      .textContent =
      "850";


    say(
      "JOB COMPLETE! +$850"
    );

  }



  else {

    say(

      !inspected

        ? "Inspect the damage first."

        : !removed

        ? "Use the Hammer."

        : !framed

        ? "Inspect the framing."

        : "Use the Nail Gun."

    );

  }

}



function input() {


  /* START BUTTON */

  $("startBtn").onclick =
    () => {

      $("start").style.display =
        "none";


      started = true;


      say(
        "Use Inspect on the damaged wall."
      );

    };



  /* USE BUTTON */

  $("use").onclick =
    interact;



  /* TOOL BUTTONS */

  document
    .querySelectorAll(".tool")
    .forEach(

      button => {

        button.onclick =
          () => {


            document
              .querySelectorAll(".tool")
              .forEach(

                x =>

                  x.classList.remove(
                    "active"
                  )

              );


            button.classList.add(
              "active"
            );


            tool =
              button.dataset.data;

          };

      }

    );



  /* JOYSTICK */

  let joy =
    $("joy");


  let stick =
    $("stick");


  let id =
    null;


  let start =
    {
      x: 0,
      y: 0
    };



  joy.onpointerdown =
    event => {

      id =
        event.pointerId;


      start =
        {
          x: event.clientX,
          y: event.clientY
        };


      joy.setPointerCapture(
        id
      );

    };



  joy.onpointermove =
    event => {

      if (
        event.pointerId !== id
      ) return;



      let dx =
        event.clientX -
        start.x;


      let dy =
        event.clientY -
        start.y;


      let length =
        Math.hypot(
          dx,
          dy
        ) || 1;


      let limit =
        Math.min(
          1,
          34 / length
        );


      dx *= limit;

      dy *= limit;



      stick.style.transform =
        `translate(${dx}px, ${dy}px)`;


      side =
        dx / 34;


      /* UP = FORWARD */

      forward =
        -dy / 34;

    };



  joy.onpointerup =
    () => {

      id =
        null;


      side =
        0;


      forward =
        0;


      stick.style.transform =
        "";

    };



  /* LOOK AROUND */

  let lookId =
    null;


  let last =
    {
      x: 0,
      y: 0
    };



  renderer.domElement.onpointerdown =
    event => {

      if (
        !started ||
        event.clientY >
        innerHeight - 190
      ) return;


      lookId =
        event.pointerId;


      last =
        {
          x: event.clientX,
          y: event.clientY
        };


      renderer.domElement.setPointerCapture(
        lookId
      );

    };



  renderer.domElement.onpointermove =
    event => {

      if (
        event.pointerId !==
        lookId
      ) return;


      let dx =
        event.clientX -
        last.x;


      let dy =
        event.clientY -
        last.y;



      last =
        {
          x: event.clientX,
          y: event.clientY
        };



      yaw -=
        dx * 0.004;



      pitch =
        Math.max(

          -1.1,

          Math.min(

            1.1,

            pitch -
            dy * 0.004

          )

        );

    };



  renderer.domElement.onpointerup =
    () => {

      lookId =
        null;

    };



  /* RESIZE */

  onresize =
    () => {

      camera.aspect =
        innerWidth /
        innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(
        innerWidth,
        innerHeight
      );

    };

}



function animate() {


  requestAnimationFrame(
    animate
  );


  let delta =
    Math.min(
      clock.getDelta(),
      0.05
    );



  if (started) {


    let speed =
      2.2 * delta;


    let forwardX =
      Math.sin(yaw);


    let forwardZ =
      Math.cos(yaw);



    camera.position.x +=

      (

        -forwardX * forward +

        forwardZ * side

      ) * speed;



    camera.position.z +=

      (

        -forwardZ * forward -

        forwardX * side

      ) * speed;



    /* ROOM BOUNDARIES */

    camera.position.x =
      Math.max(

        -3.9,

        Math.min(
          3.9,
          camera.position.x
        )

      );



    camera.position.z =
      Math.max(

        -2.3,

        Math.min(
          4,
          camera.position.z
        )

      );



    camera.rotation.y =
      yaw;


    camera.rotation.x =
      pitch;

  }



  renderer.render(
    scene,
    camera
  );

}



init();

</script>

</body>
</html>
